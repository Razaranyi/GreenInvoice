[package]
name = "green-invoice-app"
version = "0.1.0"
description = "Green Invoice Automation App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-beta.11", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.0.0-beta.11", features = [] }
tauri-plugin-log = { version = "2.0.0-beta.2" }
tauri-plugin-dialog = { version = "2.0.0-beta.2" }
tauri-plugin-fs = { version = "2.0.0-beta.2" }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
